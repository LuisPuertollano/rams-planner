name: rams-planner

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-planner}
    ports:
      - "${POSTGRES_PORT:-45432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planner} -d ${POSTGRES_DB:-planner}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Job de un solo uso. El esquema NUNCA lo aplica el arranque de la API:
  # una migración a medias durante un despliegue es imposible de auditar.
  migrate:
    image: ghcr.io/amacneil/dbmate:2.27.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-planner}:${POSTGRES_PASSWORD:-planner_dev_only}@db:5432/${POSTGRES_DB:-planner}?sslmode=disable
    volumes:
      - ./db:/db
    command: ["--wait", "up"]

volumes:
  pgdata:
