name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DBMATE_VERSION: v2.27.0

jobs:
  code:
    name: Código (lint, tipos, regla de dependencia, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La versión sale del campo packageManager de package.json. Declararla
      # también aquí hace que pnpm/action-setup falle con "Multiple versions".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Regla de dependencia (el núcleo no conoce a los adaptadores)
        run: pnpm check:deps

      - name: Ningún hallazgo del motor sin traducir
        run: pnpm check:hallazgos

      - name: Ninguna función del catálogo de permisos sin traducir
        run: pnpm check:permisos

      - name: Ningún error de la API sin código ni sin traducir
        run: pnpm check:errores

      - name: El Dockerfile no se olvida un paquete del workspace
        run: pnpm check:docker

      - name: Tests y cobertura
        run: pnpm test:coverage

      - name: Compilación completa, interfaz incluida
        run: |
          pnpm build
          pnpm --filter @planner/web build

  database:
    name: Base de datos (migraciones e invariantes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner_ci
          POSTGRES_DB: planner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U planner -d planner"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://planner:planner_ci@127.0.0.1:5432/planner?sslmode=disable
      PGPASSWORD: planner_ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          chmod +x /usr/local/bin/dbmate

      - name: Aplicar migraciones
        run: dbmate --migrations-dir ./db/migrations --no-dump-schema up

      - name: Invariantes que hace cumplir la base de datos
        run: |
          psql -h 127.0.0.1 -U planner -d planner -v ON_ERROR_STOP=1 -f db/tests/invariants.sql

      - name: El motor calcula de punta a punta contra datos reales
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          node packages/api/dist/cli.js seed-demo
          node packages/api/dist/cli.js calculate | tee /tmp/run.json
          node -e "
            const run = require('/tmp/run.json');
            if (!run.completed) { console.error('El cálculo no terminó'); process.exit(1); }
            if (run.tasks < 20) { console.error('Se esperaban al menos 20 tareas'); process.exit(1); }
            if (run.timephasedCells < 100) { console.error('Se esperaba carga repartida'); process.exit(1); }
            console.log('Cálculo correcto:', JSON.stringify(run));
          "

      # `packages/api` incluye las pruebas que entran por la puerta: montan la
      # aplicación entera y comprueban que un permiso que falta se nota.
      - name: Pruebas de integración contra la base de datos real
        run: pnpm vitest run packages/persistence packages/api

      # Una instalación que se actualiza no es una base limpia, y ese es el
      # camino que más se recorre en la vida real. Aquí se reproduce: las
      # migraciones viejas, los datos que dejó la versión anterior, y encima
      # las nuevas. Este paso existe porque una migración de semilla con
      # identificadores fijos pasó CI en verde y habría roto la actualización
      # de la única instalación que había.
      - name: Las migraciones se aplican sobre una instalación que ya tenía datos
        env:
          DATABASE_URL: postgres://planner:planner_ci@127.0.0.1:5432/planner_upgrade?sslmode=disable
        run: |
          psql -h 127.0.0.1 -U planner -d planner -c 'CREATE DATABASE planner_upgrade'

          # Todas menos la última: la versión "anterior".
          mkdir -p /tmp/migraciones-anteriores
          ls db/migrations/*.sql | head -n -1 | xargs -I{} cp {} /tmp/migraciones-anteriores/
          dbmate --migrations-dir /tmp/migraciones-anteriores --no-dump-schema up

          # Los datos que deja la versión anterior. Se insertan con SQL y no
          # con la CLI a propósito: la CLI es código NUEVO, y contra el esquema
          # viejo fallaría por razones que no tienen nada que ver con lo que
          # este paso comprueba. En una instalación real el esquema se migra
          # antes de que arranque la aplicación nueva, nunca al revés.
          # Idempotente a propósito: qué haya creado ya una migración anterior
          # cambia con el tiempo, y este paso comprueba la actualización, no
          # quién puso cada fila.
          psql -h 127.0.0.1 -U planner -d planner_upgrade -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO field_definition (entity_type, field_key, label, data_type, display_order)
          VALUES ('wbs_node', 'rams_tag', 'Disciplina RAMS', 'single_select', 1)
          ON CONFLICT (entity_type, field_key) DO NOTHING;

          INSERT INTO project (id, code, name, calendar_id, status_start, priority, currency)
          VALUES ('00000000-0000-4000-9003-000000000001', 'YA-EXISTIA',
                  'Proyecto anterior a la actualización',
                  '00000000-0000-4000-8000-000000000002', '2026-03-02', 500, 'EUR')
          ON CONFLICT (code) DO NOTHING;

          INSERT INTO wbs_node (id, project_id, node_kind, code, path, sort_key, name)
          VALUES ('00000000-0000-4000-9003-000000000002', '00000000-0000-4000-9003-000000000001',
                  'task', '1', '001', 0, 'Tarea que ya estaba')
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO task (node_id, duration_minutes) VALUES
            ('00000000-0000-4000-9003-000000000002', 2400)
          ON CONFLICT (node_id) DO NOTHING;
          SQL

          # Ahora la actualización. Si falla aquí, falla en producción.
          dbmate --migrations-dir ./db/migrations --no-dump-schema up

          etiquetas=$(psql -h 127.0.0.1 -U planner -d planner_upgrade -tAc \
            "select count(*) from field_value v join wbs_node n on n.id = v.entity_id
             where n.project_id = '00000000-0000-4000-9000-000000000001'")
          if [ "$etiquetas" -lt 1 ]; then
            echo "La plantilla se creó sin sus disciplinas: la migración no encontró el campo."
            exit 1
          fi
          echo "Actualización sobre una base con datos: OK ($etiquetas disciplinas)."

      # En una base LIMPIA a propósito: los datos de demostración referencian
      # los calendarios base, así que revertir su migración sobre ellos falla
      # por clave ajena. Eso no es un fallo de la migración, es que hay datos.
      - name: Las migraciones son reversibles
        env:
          DATABASE_URL: postgres://planner:planner_ci@127.0.0.1:5432/planner_rollback?sslmode=disable
        run: |
          psql -h 127.0.0.1 -U planner -d planner -c 'CREATE DATABASE planner_rollback'
          dbmate --migrations-dir ./db/migrations --no-dump-schema up

          # Tantas vueltas como migraciones haya: fijar el número a mano hace
          # que este paso empiece a fallar en cuanto se añade una.
          total=$(find db/migrations -name '*.sql' | wc -l)
          for _ in $(seq 1 "$total"); do
            dbmate --migrations-dir ./db/migrations --no-dump-schema down
          done

          remaining=$(psql -h 127.0.0.1 -U planner -d planner_rollback -tAc \
            "select count(*) from information_schema.tables where table_schema='public'")
          if [ "$remaining" != "1" ]; then
            echo "El rollback dejó $remaining tablas; debería quedar sólo schema_migrations."
            exit 1
          fi
          dbmate --migrations-dir ./db/migrations --no-dump-schema up

  # Este trabajo existe por una avería concreta: `packages/report` se creó y no
  # se añadió a las dos listas del `Dockerfile`, así que la imagen salió sin ese
  # paquete. Todo lo de arriba pasó en verde —lint, tipos, 400 y pico pruebas,
  # migraciones, invariantes, la actualización sobre datos viejos— y el
  # contenedor se moría al arrancar con un `ERR_MODULE_NOT_FOUND`.
  #
  # Ninguna prueba podía cazarlo porque todas corren en el workspace, donde el
  # enlace de pnpm existe. La imagen es el único sitio donde la lista importa, y
  # hasta ahora CI no la construía nunca.
  #
  # `--wait` es lo que hace el trabajo: espera a los healthchecks y **falla si
  # un contenedor se sale**, que es exactamente lo que pasó.
  contenedor:
    name: El contenedor arranca de verdad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen y levantar la pila como en producción
        run: docker compose up -d --build --wait

      - name: La API responde
        run: curl -fsS --retry 5 --retry-delay 2 http://127.0.0.1:45678/api/health

      - name: La interfaz compilada se sirve desde la misma imagen
        run: curl -fsS http://127.0.0.1:45678/ | grep -q 'id="root"'

      - name: La API contesta con su catálogo de permisos
        run: curl -fsS http://127.0.0.1:45678/api/auth/me | grep -q 'catalogue'

      # Sin esto, un fallo aquí sólo dice "el contenedor no arrancó" y hay que
      # reproducirlo a mano. Con esto, el log del contenedor está en el propio
      # fallo de CI, que es donde alguien lo va a leer.
      - name: Los logs, si algo ha ido mal
        if: failure()
        run: docker compose logs --tail=100

      - name: Apagar
        if: always()
        run: docker compose down -v
